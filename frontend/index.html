<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JARVIS 2.0</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#03060b;color:#00eaff;font-family:Arial,sans-serif;min-height:100vh}
header{text-align:center;padding:25px 10px 10px}
h1{letter-spacing:7px;margin:0}
.status{color:#55ff77;margin-top:8px}
.core{width:170px;height:170px;border:3px solid #00eaff;border-radius:50%;margin:45px auto 25px;display:flex;align-items:center;justify-content:center;box-shadow:0 0 25px #00eaff,inset 0 0 25px #00eaff;animation:pulse 2s infinite}
.core span{font-size:25px;font-weight:bold}
#messages{width:min(900px,92%);margin:auto;min-height:100px;max-height:300px;overflow-y:auto}
.msg{padding:12px 15px;margin:8px 0;border:1px solid #123c48;border-radius:12px;background:#071018}
.you{color:white}.jarvis{color:#00eaff}
.controls{width:min(900px,92%);margin:20px auto;display:flex;gap:8px}
input{flex:1;padding:15px;border-radius:12px;border:1px solid #00eaff;background:#071018;color:white;font-size:16px;outline:none}
button{border:1px solid #00eaff;background:#071018;color:#00eaff;border-radius:12px;padding:0 18px;font-size:20px}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
</style>
</head>
<body>

<header>
<h1>J.A.R.V.I.S 2.0</h1>
<div class="status">● SYSTEM ONLINE</div>
</header>

<div class="core"><span>JARVIS</span></div>

<div id="messages">
<div class="msg jarvis">JARVIS: Good day, Sir. Systems are online.</div>
</div>

<div class="controls">
<input id="input" placeholder="Ask JARVIS anything...">
<button onclick="listen()">🎙️</button>
<button onclick="sendMessage()">➤</button>
</div>

<script>
const input=document.getElementById("input");
const messages=document.getElementById("messages");

function addMessage(text,type){
 const div=document.createElement("div");
 div.className="msg "+type;
 div.textContent=text;
 messages.appendChild(div);
 messages.scrollTop=messages.scrollHeight;
}

async function sendMessage(){
 const message=input.value.trim();
 if(!message)return;

 addMessage("YOU: "+message,"you");
 input.value="";

 try{
  const response=await fetch("/api/chat",{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({message})
  });

  const data=await response.json();
  addMessage("JARVIS: "+data.reply,"jarvis");
  speak(data.reply);
 }catch(error){
  addMessage("JARVIS: Connection error, Sir.","jarvis");
 }
}

input.addEventListener("keydown",e=>{
 if(e.key==="Enter")sendMessage();
});

function speak(text){
 if("speechSynthesis" in window){
  speechSynthesis.cancel();
  const voice=new SpeechSynthesisUtterance(text);
  voice.lang="en-IN";
  speechSynthesis.speak(voice);
 }
}

function listen(){
 const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;

 if(!SpeechRecognition){
  addMessage("JARVIS: Voice recognition is not supported.","jarvis");

recognition.onstart = function() {
    interruptJarvis();
};

  return;
 }

 const recognition=new SpeechRecognition();
 recognition.lang="en-IN";
 recognition.interimResults=false;

 recognition.onstart=()=>{
  addMessage("JARVIS: Listening...","jarvis");
 };

 recognition.onspeechstart = function() {
    interruptJarvis();
};

recognition.onresult=event=>{
  input.value=event.results[0][0].transcript;
  sendMessage();
 };

 recognition.onerror=()=>{
  addMessage("JARVIS: I could not hear you, Sir.","jarvis");
 };

 recognition.start();
}
</script>

</body>
</html>
